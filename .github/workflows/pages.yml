name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 4,10,16,22 * * *"  # ~4.5h after each GFS cycle (00/06/12/18Z), when data is published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest GFS wind data
        continue-on-error: true  # keep the committed data if NOMADS is unavailable
        run: |
          pip install eccodes
          python3 scripts/fetch-gfs-wind.py 925 surface --timeline --past-hours 48 --forecast-hours 72

      - name: Version asset URLs so browsers load new JS/CSS after each deploy
        run: |
          sed -i -E 's#((src|href)="(\.\./)?(libs|styles)/[^"?]*\.(js|css))"#\1?v='"${GITHUB_SHA::8}"'"#g' \
            public/index.html public/jp/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
